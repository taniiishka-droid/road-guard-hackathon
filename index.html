</div>
    <div id="map"></div>
  </div>

  <div class="card" id="reports">
    <h2>📋 Community Reports</h2>
    <input id="search" placeholder="🔍 Search reports..." oninput="renderReports()">
    <div class="row">
      <select id="filter-category" onchange="renderReports()">
        <option value="">All categories</option>
        <option>Pothole</option>
        <option>Streetlight</option>
        <option>Waterlogging</option>
        <option>Traffic</option>
        <option>Garbage</option>
        <option>Footpath</option>
        <option>Accident</option>
        <option>Other</option>
      </select>
      <select id="filter-status" onchange="renderReports()">
        <option value="">All statuses</option>
        <option>Open</option>
        <option>In Progress</option>
        <option>Resolved</option>
      </select>
    </div>
    <div id="report-list"></div>
    <p id="empty-message">No reports yet. Be the first to report a hazard!</p>
    <button class="secondary" onclick="exportReports()">⬇ Export Reports (JSON)</button>
    <button class="secondary" onclick="clearReports()">Clear All Reports</button>
  </div>
</section>
</div>
</main>

<footer>
  <strong>🛡️ RoadGuard</strong>
  <p>Small reports. Safer roads. Stronger communities.</p>
  <p class="small">Student hackathon prototype · Verify hazards before acting on them.</p>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const STORAGE_KEY = "roadguard_reports_v1";
let reports = [];
let currentPosition = null;
let photoData = "";
let map = null;
let reportMarkers = [];
let userMarker = null;

try {
  reports = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  if (!Array.isArray(reports)) reports = [];
} catch (e) {
  reports = [];
}

function saveReports() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(reports));
  } catch (e) {
    alert("Storage is full. Try removing photos or exporting your reports.");
  }
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, function (char) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char];
  });
}

function initMap() {
  if (typeof L === "undefined") {
    document.getElementById("map").innerHTML =
      "<p style='padding:20px'>Map needs an internet connection to load.</p>";
    return;
  }

  map = L.map("map").setView([20.5937, 78.9629], 5);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  map.on("click", function (event) {
    const lat = event.latlng.lat.toFixed(6);
    const lng = event.latlng.lng.toFixed(6);

    document.getElementById("report-lat").value = lat;
    document.getElementById("report-lng").value = lng;
  });

  refreshMarkers();
}

function refreshMarkers() {
  if (!map) return;

  reportMarkers.forEach(marker => map.removeLayer(marker));
  reportMarkers = [];

  reports.forEach(report => {
    if (!Number.isFinite(Number(report.lat)) ||
        !Number.isFinite(Number(report.lng))) return;

    const marker = L.marker([Number(report.lat), Number(report.lng)])
      .addTo(map)
      .bindPopup(
        "<strong>" + escapeHTML(report.title) + "</strong><br>" +
        escapeHTML(report.category) + "<br>Status: " +
        escapeHTML(report.status) + "<br>" +
        escapeHTML(report.address || "Location reported")
      );

    reportMarkers.push(marker);
  });
}

function centerMap() {
  if (map) map.setView([20.5937, 78.9629], 5);
}

function getLocation() {
  const status = document.getElementById("gps-status");

  if (!navigator.geolocation) {
    status.textContent = "GPS is not supported by this browser.";
    return;
  }

  status.textContent = "Requesting location permission...";

  navigator.geolocation.getCurrentPosition(
    function (position) {
      currentPosition = {
        lat: position.coords.latitude,
        lng: position.coords.longitude
      };

      document.getElementById("my-lat").value = currentPosition.lat.toFixed(6);
      document.getElementById("my-lng").value = currentPosition.lng.toFixed(6);
      status.textContent = "Location detected successfully.";

      if (map) {
        map.setView([currentPosition.lat, currentPosition.lng], 15);

        if (userMarker) map.removeLayer(userMarker);

        userMarker = L.marker([
          currentPosition.lat,
          currentPosition.lng
        ]).addTo(map).bindPopup("Your current location");

        userMarker.openPopup();
      }
    },
    function (error) {
      const messages = {
        1: "Location permission denied. Allow location in browser settings.",
        2: "Location is currently unavailable.",
        3: "Location request timed out. Try again."
      };

      status.textContent = messages[error.code] || "Unable to get location.";
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

function useMyLocation() {
  if (!currentPosition) {
    getLocation();
    alert("Allow location access, then press this button again.");
    return;
  }

  document.getElementById("report-lat").value = currentPosition.lat.toFixed(6);
  document.getElementById("report-lng").value = currentPosition.lng.toFixed(6);
}

document.getElementById("photo").addEventListener("change", function () {
  const file = this.files[0];
  const preview = document.getElementById("preview");

  photoData = "";

  if (!file) {
    preview.style.display = "none";
    return;
  }

  if (!file.type.startsWith("image/")) {
    alert("Please select an image.");
    this.value = "";
    return;
  }

  if (file.size > 700000) {
    alert("Please choose an image smaller than 700 KB.");
    this.value = "";
    preview.style.display = "none";
    return;
  }

  const reader = new FileReader();

  reader.onload = function () {
    photoData = reader.result;
    preview.src = photoData;
    preview.style.display = "block";
  };

  reader.readAsDataURL(file);
});

document.getElementById("report-form").addEventListener("submit", function (event) {
  event.preventDefault();

  const latText = document.getElementById("report-lat").value.trim();
  const lngText = document.getElementById("report-lng").value.trim();

  const lat = latText === "" ? null : Number(latText);
  const lng = lngText === "" ? null : Number(lngText);

  if ((lat === null) !== (lng === null)) {
    alert("Enter both latitude and longitude, or leave both blank.");
    return;
  }

  if (lat !== null &&
      (!Number.isFinite(lat) || !Number.isFinite(lng) ||
       lat < -90 || lat > 90 || lng < -180 || lng > 180)) {
    alert("Please enter valid GPS coordinates.");
    return;
  }

  const report = {
    id: Date.now().toString() + Math.random().toString(36).slice(2, 7),
    title: document.getElementById("title").value.trim(),
    category: document.getElementById("category").value,
    priority: document.getElementById("priority").value,
    address: document.getElementById("address").value.trim(),
    lat: lat,
    lng: lng,
    description: document.getElementById("description").value.trim(),
    photo: photoData,
    status: "Open",
    createdAt: new Date().toISOString()
  };

  reports.unshift(report);
  saveReports();
  refreshMarkers();
  renderReports();

  this.reset();
  photoData = "";
  document.getElementById("preview").style.display = "none";

  alert("Report saved in this browser! For now, it is not shared with other users.");

  document.getElementById("reports").scrollIntoView({ behavior: "smooth" });
});

function renderReports() {
  const query = document.getElementById("search").value.toLowerCase().trim();
  const category = document.getElementById("filter-category").value;
  const status = document.getElementById("filter-status").value;

  const filtered = reports.filter(report => {
    const text = [
      report.title,
      report.category,
      report.address,
      report.description
    ].join(" ").toLowerCase();

    return text.includes(query) &&
      (!category || report.category === category) &&
      (!status || report.status === status);
  });

  document.getElementById("total").textContent = reports.length;
  document.getElementById("open-count").textContent =
    reports.filter(r => r.status === "Open").length;
  document.getElementById("progress-count").textContent =
    reports.filter(r => r.status === "In Progress").length;
  document.getElementById("resolved-count").textContent =
    reports.filter(r => r.status === "Resolved").length;

  const list = document.getElementById("report-list");
  const empty = document.getElementById("empty-message");

  list.innerHTML = "";
  empty.style.display = filtered.length ? "none" : "block";

  filtered.forEach(report => {
    const article = document.createElement("article");
    article.className = "report";

    const title = document.createElement("h3");
    title.textContent = report.title;

    const tags = document.createElement("div");
    tags.innerHTML =
      '<span class="tag">' + escapeHTML(report.category) + '</span>' +
      '<span class="tag">' + escapeHTML(report.priority) + ' priority</span>' +
      '<span class="tag">' + escapeHTML(report.status) + '</span>';

    const description = document.createElement("p");
    description.textContent = report.description || "No extra details provided.";

    const address = document.createElement("p");
    address.textContent = "📍 " + (report.address || "No landmark added");

    const date = document.createElement("p");
    date.className = "small";
    date.textContent = "Reported: " + new Date(report.createdAt).toLocaleString();

    article.append(title, tags, description, address, date);

    if (report.photo) {
      const img = document.createElement("img");
      img.src = report.photo;
      img.alt = "Uploaded hazard";
      img.style.cssText = "max-width:100%;max-height:200px;border-radius:10px";
      article.appendChild(img);
    }

    if (report.lat !== null && report.lng !== null) {
      const coords = document.createElement("p");
      coords.className = "small";
      coords.textContent = "GPS: " + report.lat + ", " + report.lng;
      article.appendChild(coords);

      const mapLink = document.createElement("a");
      mapLink.href = "https://www.openstreetmap.org/?mlat=" +
        encodeURIComponent(report.lat) + "&mlon=" +
        encodeURIComponent(report.lng) + "#map=17/" +
        encodeURIComponent(report.lat) + "/" + encodeURIComponent(report.lng);
      mapLink.target = "_blank";
      mapLink.rel = "noopener noreferrer";
      mapLink.textContent = "Open location on map";
      article.appendChild(mapLink);
    }

    const statusButton = document.createElement("button");
    statusButton.textContent = "Change status";
    statusButton.onclick = function () {
      const options = ["Open", "In Progress", "Resolved"];
      const next = options[(options.indexOf(report.status) + 1) % options.length];
      report.status = next;
      saveReports();
      renderReports();
      refreshMarkers();
    };

    const deleteButton = document.createElement("button");
    deleteButton.textContent = "Delete report";
    deleteButton.className = "secondary";
    deleteButton.onclick = function () {
      if (!confirm("Delete this report from this browser?")) return;
      reports = reports.filter(r => r.id !== report.id);
      saveReports();
      renderReports();
      refreshMarkers();
    };

    article.append(statusButton, deleteButton);
    list.appendChild(article);
  });
}

function exportReports() {
  const blob = new Blob(
    [JSON.stringify(reports, null, 2)],
    { type: "application/json" }
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "roadguard-reports.json";
  link.click();
  URL.revokeObjectURL(url);
}

function clearReports() {
  if (!confirm("Delete ALL saved reports from this browser? Export first if needed.")) return;

  reports = [];
  saveReports();
  renderReports();
  refreshMarkers();
}

initMap();
renderReports();
</script>
</body>
</html>
